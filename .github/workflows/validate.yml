name: Validate FSH

on:
  push:
    branches-ignore:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # Aktivera anropet till Region Stockholms delade workflow när det är konfigurerat.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Stop unconfigured FSH validation
        run: |
          echo "::error::Region Stockholms workflow för FSH-validering är inte konfigurerat. Se docs/forbereda-och-releasa-ig.md."
          exit 1
