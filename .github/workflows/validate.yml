name: Validate FSH

on:
  push:
    branches-ignore:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # Exempel på tidigare anrop. Byt till Region Stockholms repository och
  # aktivera anropet när det egna valideringsworkflowet är konfigurerat.
  # validate:
  #   uses: Inera-AB/fhir-ig-workflows/.github/workflows/validate.yml@v1
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Stop unconfigured FSH validation
        run: |
          echo "::error::Region Stockholms workflow för FSH-validering är inte konfigurerat. Se docs/forbereda-och-releasa-ig.md."
          exit 1
