name: Build and publish IG

# Branch previews go to this repo's GitHub Pages. No portal secret is
# forwarded, so the shared workflow cannot update the Inera catalog.

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'support/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: Inera-AB/fhir-ig-workflows/.github/workflows/build.yml@v1
