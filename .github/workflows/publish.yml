name: Build and publish IG

# Ineras delade workflow finns i ett separat repository som Inera äger.
# Sätt upp motsvarande repository inom Region Stockholm och ändra anropet
# nedan så att det pekar dit. Se docs/forbereda-och-releasa-ig.md.

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'support/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Exempel på tidigare anrop; anpassa och aktivera först när Region
  # Stockholms workflow och publiceringsmål är konfigurerade.
  # build:
  #   uses: Inera-AB/fhir-ig-workflows/.github/workflows/build.yml@v1
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Stop unconfigured branch publication
        run: |
          echo "::error::Region Stockholms workflow för branchpublicering är inte konfigurerat. Se docs/forbereda-och-releasa-ig.md."
          exit 1
