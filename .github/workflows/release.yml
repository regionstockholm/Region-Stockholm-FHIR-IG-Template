name: Publish release

# Ineras delade workflow finns i ett separat repository som Inera äger.
# Sätt upp motsvarande repository inom Region Stockholm och ändra anropet
# nedan så att det pekar dit. Se docs/forbereda-och-releasa-ig.md.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Exempel på tidigare anrop; anpassa och aktivera först när Region
  # Stockholms workflow, webbrot och behörigheter är konfigurerade.
  # release:
  #   uses: Inera-AB/fhir-ig-workflows/.github/workflows/release.yml@v1
  #   with:
  #     package-feed: false
  #   secrets: inherit
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Stop unconfigured publication
        run: |
          echo "::error::Region Stockholms publiceringsmål är inte konfigurerat. Se docs/forbereda-och-releasa-ig.md."
          exit 1
