name: Publish release

# Release publication is blocked until Region Stockholm has configured its
# own web roots and credentials. See docs/forbereda-och-releasa-ig.md.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Stop unconfigured publication
        run: |
          echo "::error::Region Stockholms publiceringsmål är inte konfigurerat. Se docs/forbereda-och-releasa-ig.md."
          exit 1
