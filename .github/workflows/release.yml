name: Build release artifact

# Transitional workflow: build a tagged version but do not publish it.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release tag
        run: |
          VERSION=$(ruby -ryaml -e 'v = YAML.safe_load_file("sushi-config.yaml")["version"]; abort "Missing version in sushi-config.yaml" unless v.is_a?(String) && !v.empty?; puts v')
          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ || "$GITHUB_REF_NAME" != "$VERSION" ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} must match version ${VERSION} in sushi-config.yaml and have the form X.Y.Z or X.Y.Z-suffix."
            exit 1
          fi

      - uses: Inera-AB/fhir-ig-workflows/actions/setup-ig-tools@v1

      - name: Build IG
        run: |
          sushi .
          java -jar input-cache/publisher.jar -ig ig.ini -tx https://tx.fhir.org/r4
          test -f output/qa.json

      - name: Upload IG build
        uses: actions/upload-artifact@v4
        with:
          name: ig-build-${{ github.ref_name }}
          path: output/
          if-no-files-found: error
          retention-days: 30
